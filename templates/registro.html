{% extends "base.html" %}

{% block titulo %}Registrar - Siat Solutions{% endblock %}

{% block conteudo %}
<div class="container">
    <h1 class="mb-4">📝 Criar Conta</h1>
    
    <form id="formRegistro" class="form-registro" action="/registro" method="post">
        <div class="mb-3">
            <label for="nome" class="form-label">Nome completo *</label>
            <input type="text" id="nome" name="nome" class="form-control" value="{{ nome }}" required>
        </div>
        
        <div class="mb-3">
            <label for="email" class="form-label">Email *</label>
            <input type="email" id="email" name="email" class="form-control" value="{{ email }}" required>
        </div>
        
        <div class="mb-3">
            <label for="senha" class="form-label">Senha *</label>
            <input type="password" id="senha" name="senha" class="form-control" placeholder="Mínimo 6 caracteres" required minlength="6">
        </div>
        
        <div class="mb-3">
            <label for="confirma_senha" class="form-label">Confirmar senha *</label>
            <input type="password" id="confirma_senha" name="confirma_senha" class="form-control" placeholder="Digite a senha novamente" required>
        </div>
        
        {% if error %}
            <div class="alert alert-danger mt-3">
                <p>{{ error }}</p>
            </div>
        {% endif %}
        
        <div class="d-flex justify-content-between mt-4">
            <button type="submit" class="btn btn-primary">Criar Conta</button>
            <a href="/login" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
    
    <div class="mt-3 text-center">
        <p>Já tem uma conta? <a href="/login">Fazer login</a></p>
    </div>
</div>
{% endblock %}

{% endblock %}
